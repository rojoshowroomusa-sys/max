# Configuración del proyecto Supabase.
# Usar como base; ajustar project_id al del proyecto real.

project_id = "jiprthnqojpybfzmwmso"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322

[studio]
enabled = true

[inbucket]
enabled = true

[storage]
enabled = true

[functions]
enabled = true

# Edge function que crea la preferencia de pago de Mercado Pago.
# verify_jwt = false porque el sitio no tiene autenticación de usuario.
[functions.create-mp-preference]
enabled = true
verify_jwt = false

# Webhook que confirma el pago real de Mercado Pago y marca la orden como 'paid'.
# La confirmación de pago la hace MP server-side: no hay JWT de usuario.
[functions.mp-webhook]
enabled = true
verify_jwt = false