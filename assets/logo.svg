<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Logo MAX Carnes Premium</title>
  <desc id="logoDesc">Sello heráldico con un toro y el texto MAX Carnes Premium</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c883"/>
      <stop offset="0.5" stop-color="#b8914b"/>
      <stop offset="1" stop-color="#8f6a2f"/>
    </linearGradient>
    <radialGradient id="sealDark" cx="0.5" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#2a2e35"/>
      <stop offset="0.65" stop-color="#141518"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </radialGradient>
  </defs>

  <!-- Seal rings -->
  <circle cx="200" cy="210" r="150" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="200" cy="210" r="156" fill="none" stroke="#c9a35c" stroke-width="2"/>
  <circle cx="200" cy="210" r="142" fill="none" stroke="#6f5b3a" stroke-width="1.5"/>
  <circle cx="200" cy="210" r="124" fill="url(#sealDark)" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="200" cy="210" r="110" fill="none" stroke="#8a6d3b" stroke-width="1.5" opacity="0.8"/>

  <!-- Fine arc under MAX -->
  <path d="M 132 104 Q 200 92 268 104" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.85"/>

  <!-- MAX wordmark -->
  <text x="200" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="46" letter-spacing="12" fill="url(#gold)">MAX</text>

  <!-- Diamond accents -->
  <g fill="url(#gold)">
    <rect x="86" y="116" width="11" height="11" transform="rotate(45 91.5 121.5)"/>
    <rect x="303" y="116" width="11" height="11" transform="rotate(45 308.5 121.5)"/>
    <rect x="195" y="66" width="10" height="10" transform="rotate(45 200 71)"/>
  </g>

  <!-- Horns -->
  <g fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round">
    <path d="M 142 210 C 118 198 106 170 112 148"/>
    <path d="M 258 210 C 282 198 294 170 288 148"/>
  </g>

  <!-- Head silhouette -->
  <path d="M 142 284 Q 142 220 200 220 Q 258 220 258 284 Q 258 332 200 332 Q 142 332 142 284 Z" fill="#15171c" stroke="#b8914b" stroke-width="2.5"/>

  <!-- Ears -->
  <ellipse cx="144" cy="252" rx="13" ry="24" fill="#15171c" stroke="#b8914b" stroke-width="2.5" transform="rotate(-20 144 252)"/>
  <ellipse cx="256" cy="252" rx="13" ry="24" fill="#15171c" stroke="#b8914b" stroke-width="2.5" transform="rotate(20 256 252)"/>

  <!-- Face -->
  <path d="M 154 282 Q 154 234 200 234 Q 246 234 246 282 Q 246 318 200 318 Q 154 318 154 282 Z" fill="#efe8d8"/>

  <!-- Eyes -->
  <circle cx="180" cy="268" r="6" fill="#15171c"/>
  <circle cx="220" cy="268" r="6" fill="#15171c"/>
  <circle cx="182" cy="266" r="2" fill="#efe8d8"/>
  <circle cx="222" cy="266" r="2" fill="#efe8d8"/>

  <!-- Muzzle -->
  <ellipse cx="200" cy="306" rx="22" ry="12" fill="#ded0b0"/>
  <path d="M 188 306 l 4 7" fill="none" stroke="#15171c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 212 306 l -4 7" fill="none" stroke="#15171c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 200 306 v 9" fill="none" stroke="#15171c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wordmark -->
  <line x1="96" y1="452" x2="304" y2="452" stroke="url(#gold)" stroke-width="2"/>
  <text x="200" y="476" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="27" letter-spacing="7" fill="url(#gold)">CARNES PREMIUM</text>
  <text x="200" y="502" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#8a6d3b">FINAS CARNES ARGENTINAS</text>
</svg>