<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Logo MAX Carnes Premium</title>
  <desc id="logoDesc">Cinta azul con una cabeza de vaca y el texto MAX Carnes Premium</desc>

  <!-- Ribbons -->
  <g>
    <path d="M145 320 L110 470 L155 470 L175 350 Z" fill="#0ea5e9"/>
    <path d="M255 320 L290 470 L245 470 L225 350 Z" fill="#0ea5e9"/>
    <path d="M110 470 L155 470 L155 455 L125 455 Z" fill="#38bdf8"/>
    <path d="M290 470 L245 470 L245 455 L275 455 Z" fill="#38bdf8"/>
    <path d="M145 320 L110 470 L155 470 L175 350 Z" fill="none" stroke="#0369a1" stroke-width="3" stroke-linejoin="round"/>
    <path d="M255 320 L290 470 L245 470 L225 350 Z" fill="none" stroke="#0369a1" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Outer ribbon circle with scalloped edge -->
  <g>
    <circle cx="200" cy="200" r="150" fill="none" stroke="#38bdf8" stroke-width="16"/>
    <circle cx="200" cy="200" r="150" fill="none" stroke="#0ea5e9" stroke-width="16" stroke-dasharray="18 10"/>
    <circle cx="200" cy="200" r="150" fill="none" stroke="#0284c7" stroke-width="3"/>
    <circle cx="200" cy="200" r="122" fill="#0891b2" stroke="#e0f2fe" stroke-width="8"/>
  </g>

  <!-- Inner decorative circle -->
  <circle cx="200" cy="200" r="108" fill="none" stroke="#bae6fd" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- MAX text -->
  <text x="200" y="145" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="44" fill="#111827" letter-spacing="4">MAX</text>

  <!-- Cow head -->
  <g>
    <!-- Ears -->
    <ellipse cx="128" cy="235" rx="34" ry="20" fill="#374151" transform="rotate(-20 128 235)"/>
    <ellipse cx="272" cy="235" rx="34" ry="20" fill="#374151" transform="rotate(20 272 235)"/>
    <ellipse cx="132" cy="237" rx="20" ry="11" fill="#9ca3af" transform="rotate(-20 132 237)"/>
    <ellipse cx="268" cy="237" rx="20" ry="11" fill="#9ca3af" transform="rotate(20 268 237)"/>

    <!-- Head base -->
    <ellipse cx="200" cy="275" rx="62" ry="72" fill="#374151"/>
    <ellipse cx="200" cy="280" rx="52" ry="60" fill="#f3f4f6"/>

    <!-- White face pattern -->
    <path d="M155 235 Q200 205 245 235 Q255 300 200 350 Q145 300 155 235 Z" fill="#f9fafb"/>

    <!-- Eyes -->
    <circle cx="178" cy="270" r="9" fill="#111827"/>
    <circle cx="222" cy="270" r="9" fill="#111827"/>
    <circle cx="181" cy="267" r="3" fill="#ffffff"/>
    <circle cx="225" cy="267" r="3" fill="#ffffff"/>

    <!-- Muzzle -->
    <ellipse cx="200" cy="325" rx="34" ry="26" fill="#fda4af"/>
    <ellipse cx="188" cy="322" rx="6" ry="9" fill="#9f1239" transform="rotate(-15 188 322)"/>
    <ellipse cx="212" cy="322" rx="6" ry="9" fill="#9f1239" transform="rotate(15 212 322)"/>
    <path d="M190 335 Q200 342 210 335" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Carnes Premium curved text -->
  <path id="bottomArc" d="M115 290 Q200 345 285 290" fill="none"/>
  <text font-family="Comic Sans MS, cursive, sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">Carnes Premium</textPath>
  </text>

  <!-- Gold star accents -->
  <path d="M105 105 L112 120 L128 120 L116 130 L120 146 L105 136 L90 146 L94 130 L82 120 L98 120 Z" fill="#fde047"/>
  <path d="M295 105 L302 120 L318 120 L306 130 L310 146 L295 136 L280 146 L284 130 L272 120 L288 120 Z" fill="#fde047"/>
</svg>
